 x="124.2375" y="160.4897">1. Seleccionar RFC en estado 'En Subsanaci&#195;&#179;n'</text><polygon fill="#181818" points="51.2964,190.1934,41.2964,194.1934,51.2964,198.1934,47.2964,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="45.2964" x2="489.6304" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="426.334" x="52.2964" y="189.4385">2. Presentar formulario de subsanaci&#195;&#179;n y pliego formal de observaciones</text><polygon fill="#181818" points="478.6304,219.1421,488.6304,223.1421,478.6304,227.1421,482.6304,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="40.2964" x2="484.6304" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="414.0195" x="58.4536" y="218.3872">3. Modificar campos requeridos, ampliar justificaci&#195;&#179;n y adjuntar anexos</text><line style="stroke:#181818;stroke-width:1.0;" x1="490.6304" x2="532.6304" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="532.6304" x2="532.6304" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="491.6304" x2="532.6304" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="501.6304,261.0908,491.6304,265.0908,501.6304,269.0908,497.6304,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="416.2031" x="497.6304" y="247.3359">4. Validar atenci&#195;&#179;n de observaciones y completitud de campos (RN-01)</text><line style="stroke:#181818;stroke-width:1.0;" x1="490.6304" x2="532.6304" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="532.6304" x2="532.6304" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="491.6304" x2="532.6304" y1="3