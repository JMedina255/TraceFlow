M</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114" x="425.5" y="381.937"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100" x="432.5" y="402.0688">TraceFlow SCM</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="173" x="838" y="115.2305">Analista de Requerimientos</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="51" x="899" y="131.3291">/ Gestor</text><ellipse cx="927.5" cy="50.5986" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M927.5,58.5986 L927.5,85.5986 M914.5,66.5986 L940.5,66.5986 M927.5,85.5986 L914.5,100.5986 M927.5,85.5986 L940.5,100.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="173" x="838" y="395.0688">Analista de Requerimientos</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="51" x="899" y="411.1675">/ Gestor</text><ellipse cx="927.5" cy="422.6343" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M927.5,430.6343 L927.5,457.6343 M914.5,438.6343 L940.5,438.6343 M927.5,457.6343 L914.5,472.6343 M927.5,457.6343 L940.5,472.6343 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="470.5,161.2446,480.5,165.2446,470.5,169.2446,474.5,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="40.5" x2="476.5" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="277" x="123" y="160.4897">1. Seleccionar RFC en estado 'En Subsanaci&#243;n'</text><polygon fill="#181818" points="51.5,190.1934,41.5,194.1934,51.5,198.1934,47.5,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="45.5" x2="481.5" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418" x="52.5" y="189.4385">2. Presentar formulario de subsanaci&#243;n y pliego formal de observaciones</text><polygon fill="#181818" points="470.5,219.1421,480.5,223.1421,470.5,227.1421,474.5,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="40.5" x2="476.5" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410" x="56.5" y="218.3872">3. Modificar campos requeridos, ampliar justificaci&#243;n y adjuntar anexos</text><line style="stroke:#181818;stroke-width:1.0;" x1="482.5" x2="524.5" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="524.5" x2="524.5" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="483.5" x2="524.5" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="493.5,261.0908,483.5,265.0908,493.5,269.0908,489.5,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410" x="489.5" y="247.3359">4. Validar atenci&#243;n de observaciones y completitud de campos (RN-01)</text><line style="stroke:#181818;stroke-width:1.0;" x1="482.5" x2="524.5" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="524.5" x2="524.5" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="483.5" x2="524.5" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="493.5,303.0396,483.5,307.0396,493.5,311.0396,489.5,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="431" x="489.5" y="289.2847">5. Actualizar expediente de RFC y transicionar estado oficial a 'Registrada'</text><polygon fill="#181818