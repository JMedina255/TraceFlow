ze="13" lengthAdjust="spacing" textLength="468" x="588.5" y="289.2847">5. Registrar ECS con c&#243;digo un&#237;voco y depositar en biblioteca designada (RN-04)</text><polygon fill="#181818" points="121.5,331.9883,111.5,335.9883,121.5,339.9883,117.5,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="115.5" x2="580.5" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="349" x="171.5" y="331.2334">6. Emitir confirmaci&#243;n de catalogaci&#243;n formal del nuevo ECS</text><polygon fill="#181818" points="1109.5,360.937,1119.5,364.937,1109.5,368.937,1113.5,364.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="581.5" x2="1115.5" y1="364.937" y2="364.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="374" x="664.5" y="360.1821">6. Notificar disponibilidad del nuevo ECS para el flujo de cambios</text><!--SRC=[TPF1Jjn038RlUGgB4qXie9HMBK8hRRTBrGEePMbFlJWJ9vZEZCFC1CJZzDW39nvXNwoUiBiiRRb46i_u-st_Jlp9liE03k8brdBBleK6RQGYhc-2zBus4Zm5UBSHhwd1tgOJyUaC7S4aCDgD-qZNFNb3fnGZjZInt7emv1E5eaYSBC5nDVxuQJIVVHtjlp-2Ssevfe01PjCvR4-_QNJdUAyQ5mMQ906s9k6wvqHwW3sOnOwCIceEmiNYj_5iP0immjEpGaj9RBX3ds3h8g2X4oktC9-U3Y_dcamEr_pQiHzggFLO4qp5DzpsciUB1__3xy47hYoBmZ7mKYqd5SL6RQFn2dm4hqgOaoLZMBns9jr0okomRjVtT2Cmi-HqElAlBcphG7QA9HD6odzIEuA34hu4Yfghh4Q2wsqkBdCC9hJIBZ5tS4MgTzqlxd6u5TU9pux4byf_NS9dtoezbock2hGBncBaXiqZTHTkACI1hxFBXkmgkoDVg_ciyxa33EQIjSCATR7MNMoe79RmNOsiLQJFZ1hhNDzAa69Q_FBvrk6TX5B7fDykOqdniNT3EwoDj658tZu_6-qVxFnNx4tvrwOPqRrSFDJSYielxc_4Y6Ar2OcSPqeUghNj6e-woLZZeyhXoyQyBM7cE7784Wq7XslpdnkJJKEhSRlQXUdyEJNls00yapJCNjUJexh75Tlbl3QI8V-2e976zbVBJN0LIop-0000]--></g></svg>