0000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="419" x="537.5" y="231.3872">3. Validar ausencia de bloqueo activo preexistente sobre el ECS (RN-06)</text><line style="stroke:#181818;stroke-width:1.0;" x1="530.5" x2="572.5" y1="278.0908" y2="278.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="572.5" x2="572.5" y1="278.0908" y2="291.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="531.5" x2="572.5" y1="291.0908" y2="291.0908"/><polygon fill="#181818" points="541.5,287.0908,531.5,291.0908,541.5,295.0908,537.5,291.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="502" x="537.5" y="273.3359">4. Registrar bloqueo exclusivo asociando Desarrollador, ECN/ECO y estampa temporal</text><line style="stroke:#181818;stroke-width:1.0;" x1="530.5" x2="572.5" y1="320.0396" y2="320.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="572.5" x2="572.5" y1="320.0396" y2="333.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="531.5" x2="572.5" y1="333.0396" y2="333.0396"/><polygon fill="#181818" points="541.5,329.0396,531.5,333.0396,541.5,337.0396,537.5,333.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="456" x="537.5" y="315.2847">5. Actualizar cat&#225;logo impidiendo nuevas operaciones de Check-Out a terceros</text><polygon fill="#181818" points="118.5,357.9883,108.5,361.9883,118.5,365.9883,114.5,361.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="112.5" x2="529.5" y1="361.9883" y2="361.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399" x="119.5" y="357.2334">6. Confirmar aplicaci&#243;n de bloqueo y asentar transacci&#243;n en auditor&#237;a</text><!--SRC=[VL9BRjj03Dth58HN2L3BTJz1OGG6LCVfAWuQjrrrGuzeXSXeg796-VGsFK1MFO8lLafs