472.6343 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114" x="564.5" y="103.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100" x="571.5" y="123.3291">TraceFlow SCM</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114" x="564.5" y="381.937"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100" x="571.5" y="402.0688">TraceFlow SCM</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="236" x="1055.5" y="131.3291">Comit&#233; de Control de Cambios (CCB)</text><ellipse cx="1176.5" cy="66.6973" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1176.5,74.6973 L1176.5,101.6973 M1163.5,82.6973 L1189.5,82.6973 M1176.5,101.6973 L1163.5,116.6973 M1176.5,101.6973 L1189.5,116.6973 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="236" x="1055.5" y="395.0688">Comit&#233; de Control de Cambios (CCB)</text><ellipse cx="1176.5" cy="406.5356" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1176.5,414.5356 L1176.5,441.5356 M1163.5,422.5356 L1189.5,422.5356 M1176.5,441.5356 L1163.5,456.5356 M1176.5,441.5356 L1189.5,456.5356 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="609.5,161.2446,619.5,165.2446,609.5,169.2446,613.5,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="107.5" x2="615.5" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="442" x="143.5" y="160.4897">1. Seleccionar RFC con doble validaci&#243;n aprobada para proceder al Check-In</text><polygon fill="#181818" points="118.5,190.1934,108.5,194.1934,118.5,198.1934,114.5,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="112.5" x2="620.5" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="490" x="119.5" y="189.4385">2. Presentar expediente t&#233;cnico consolidando ECN/ECO, Certificado QA y Acta UAT</text><polygon fill="#181818" points="609.5,219.1421,619.5,223.1421,609.5,227.1421,613.5,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="107.5" x2="615.5" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400" x="164.5" y="218.3872">3. Confirmar transferencia formal del ECS hacia la Biblioteca Maestra</text><line style="stroke:#181818;stroke-width:1.0;" x1="621.5" x2="663.5" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="663.5" x2="663.5" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="622.5" x2="663.5" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="632.5,261.0908,622.5,265.0908,632.5,269.0908,628.5,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="518" x="628.5" y="247.3359">4. Validar Orden Emitida, Certificado QA, Acta UAT, checksum y bloqueo vigente (RN-09)</text><line style="stroke:#181818;stroke-width:1.0;" x1="621.5" x2="663.5" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="663.5" x2="663.5" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="622.5" x2="663.5" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="632.5,303.0396,622.5,307.0396,632.5,311.0396,628.5,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="541" x="628.5" y="289.2847">5. Integrar ECS en Biblioteca Maestra, asignar nueva versi&#243;n y liberar bloqueo (RN-02, RN-06)</text><polygon fill="#181818" points="118.5,331.9883,108.5,335.9883,118.5,339.9883,114.5,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="112.5" x2="620.5" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="378" x="175.5" y="331.2334">6. Registrar asiento hist&#243;rico de Check-In en bit&#225;cora de auditor&#237;a</text><polygon fill="#181818" points="1164.5,360.937,1174.5,364.937,1164.5,368.937,1168.5,364.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="621.5" x2="1170.5" y1="364.937" y2="364.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="446" x="676" y="360.1821">6. Notificar integraci&#243;n exitosa habilitando la creaci&#243;n de la nueva L&#237;nea Base</text><!--SRC=[RLDDJzj04BtxLuno8b9Y2crHYn1IS4E5r8H2eATUnkknCsAzc-wk0_oS7dlWn4_87-liXgHfoydxDU-zUM_ixzWiq64BVewLlMVJG8tQK-QtDyvsfbBM6NBmOUUyeXex7Swj2LDi2KQEKU_SU_hHaL4q8U-neP7cne0Y4yXbMU2W2KxAqq-VXxFnrV3Wy1Z6DQdGeODYJkfkU65WhxYLc_x9VdcQPQY2TT0RLIqRzi69NYSYeB2cvgPpg7ZrRBwRVJZZKhCDfD2nxG5wI4MPw0giU84cGEz62kXSstkO5PFqQ2QerEA6gB0jXzMl5uhWh4vBR4ksNgGLP_rK9eiiImGmFDs07CD13ZFIf1HR8prTdnUWh87AbjBu4ZLNQy602sTBh12YRI0RHPLOZNhhG_O22aCXI4p7S9Z3LqTUx1HmUbXGnT5Q4CNAiBAHpDl8OYeBusAwFouk1r2GM52p4lFWQWIFC581uNPqyqe7R_ErjwuL2l7R-9gS9Ce8jPN3w8SMw1dCCHvgt74U9aWnf3_QTv3VvV0jEU3WqbLaO2nMo_PVVOEjl06eQ8RlMj5SQYkZPM79JUfvxtewVFEn_ohL-nmkv4tZX2jA5RB_HGuaHvbEUM8wMY8ioVcKpIDeBYdMRZWJr-40ukUe_reoHpbSKvCcr4LSaMXXBllLiul1n27Q3BYeAMN8VihlXV42kufb-5PF-1UoZ5Z2dTgrEGvutTDwWkX1YZnA32Lh3Ybn2KCvUdaWoB9Vz_PbzMH8aaBvoNy3]--></g></svg>