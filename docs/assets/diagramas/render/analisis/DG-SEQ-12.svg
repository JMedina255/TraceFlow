343 L109.1582,457.6343 M96.1582,438.6343 L122.1582,438.6343 M109.1582,457.6343 L96.1582,472.6343 M109.1582,457.6343 L122.1582,472.6343 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="574.0166" y="103.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="581.0166" y="123.3291">TraceFlow SCM</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="574.0166" y="381.937"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="581.0166" y="402.0688">TraceFlow SCM</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="246.0596" x="1071.9131" y="131.3291">Comit&#195;&#169; de Control de Cambios (CCB)</text><ellipse cx="1197.9429" cy="66.6973" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1197.9429,74.6973 L1197.9429,101.6973 M1184.9429,82.6973 L1210.9429,82.6973 M1197.9429,101.6973 L1184.9429,116.6973 M1197.9429,101.6973 L1210.9429,116.6973 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="246.0596" x="1071.9131" y="395.0688">Comit&#195;&#169; de Control de Cambios (CCB)</text><ellipse cx="1197.9429" cy="406.5356" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1197.9429,414.5356 L1197.9429,441.5356 M1184.9429,422.5356 L1210.9429,422.5356 M1197.9429,441.5356 L1184.9429,456.5356 M1197.9429,441.5356 L1210.9429,456.5356 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="619.189,161.2446,629.189,165.2446,619.189,169.2446,623.189,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="109.1582" x2="625.189" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="452.3594" x="143.9939" y="160.4897">1. Seleccionar RFC con doble validaci&#195;&#179;n aprobada para proceder al Check-In</text><polygon fill="#181818" points="120.1582,190.1934,110.1582,194.1934,120.1582,198.1934,116.1582,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="114.1582" x2="630.189" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="498.0308" x="121.1582" y="189.4385">2. Presentar expediente t&#195;&#169;cnico consolidando ECN/ECO, Certificado QA y Acta UAT</text><polygon fill="#181818" points="619.189,219.1421,629.189,223.1421,619.189,227.1421,623.189,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="109.1582" x2="625.189" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400.2832" x="170.032" y="218.3872">3. Confirmar transferencia formal del ECS hacia la Biblioteca Maestra</text><line style="stroke:#181818;stroke-width:1.0;" x1="631.189" x2="673.189" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="673.189" x2="673.189" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="632.189" x2="673.189" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="642.189,261.0908,632.189,265.0908,642.189,269.0908,638.189,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="517.3276" x="638.189" y="247.3359">4. Validar Orden Emitida, Certificado QA, Acta UAT, checksum y bloqueo vigente (RN-09)</text><line style="stroke:#181818;stroke-width:1.0;" x1="631.189" x2="673.189" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="673.189" x2="673.189" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="632.189" x2="673.189" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="642.189,303.0396,632.189,307.0396,642.189,311.0396,638.189,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="552.7539" x="638.189" y="289.2847">5. Integrar ECS en Biblioteca Maestra, asignar nueva versi&#195;&#179;n y liberar bloqueo (RN-02, RN-06)</text><polygon fill="#181818" points="120.1582,331.9883,110.1582,335.9883,120.1582,339.9883,116.1582,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="114.1582" x2="630.189" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5786" x="170.3843" y="331.2334">6. Registrar asiento hist&#195;&#179;rico de Check-In en bit&#195;&#161;cora de auditor&#195;&#173;a</text><polygon fill="#181818" points="1185.9429,360.937,1195.9429,364.937,1185.9429,368.937,1189.9429,364.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="631.189" x2="1191.9429" y1="364.937" y2="364.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="468.2666" x="680.4326" y="360.1821">6. Notificar integraci&#195;&#179;n exitosa habilitando la creaci&#195;&#179;n de la nueva L&#195;&#173;nea Base</text><!--SRC=[RLDDRnCn4BtlhnZrr4X9IWjK45MLqYL1bKXAavOJbrdlx6PKhnriRzgU-qiuSk34Fu0_njZv841FQu_jzzwyD-lls2pHOGD-WQMzPrD3XTfJvdSdphQcLDOPSl1chrvIXQqEOsl251k2eMFKU-UUlhHa54t8UwnfgBaseCW4SbaME6Y2i-BytVlUV7JTEpuPmAWY5Lfqa2z8tVKk3HpcjtBIEJigphCCLR0E3ePbmuPzSABNYGZ8hQcuRXqg_lNqyuVvR8xWWWlDDf12n_O0q4Dwbecom8gNQ08StCWJ6cjx3_DyaYxD1PSQt5Bbjk4WcDysDC5PdPRO56ozoCilEkcXBB8iKK3lV0ipWEC-p4cJKcoDz3KRvw2iWT8MqlmADPTRqO1BPmii4Q9v81j5fHYEUkT6je