a de pruebas en Biblioteca de Trabajo</text><line style="stroke:#181818;stroke-width:1.0;" x1="580.4546" x2="622.4546" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="622.4546" x2="622.4546" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="581.4546" x2="622.4546" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="591.4546,261.0908,581.4546,265.0908,591.4546,269.0908,587.4546,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="465.2896" x="587.4546" y="247.3359">4. Validar ejecuci&#195;&#179;n sin errores y satisfacci&#195;&#179;n de criterios de cobertura (RN-01)</text><line style="stroke:#181818;stroke-width:1.0;" x1="580.4546" x2="622.4546" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="622.4546" x2="622.4546" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="581.4546" x2="622.4546" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="591.4546,303.0396,581.4546,307.0396,591.4546,311.0396,587.4546,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="450.855" x="587.4546" y="289.2847">5. Registrar reporte de resultados unitarios en bit&#195;&#161;cora de ECN/ECO (RN-03)</text><polygon fill="#181818" points="87.4893,331.9883,77.4893,335.9883,87.4893,339.9883,83.4893,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="81.4893" x2="579.4546" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="479.9653" x="88.4893" y="331.2334">6. Confirmar &#195;&#169;xito y habilitar opci&#195;&#179;n de promover ECS a pruebas de integraci&#195;&#179;n</text><!--SRC=[RLBDSjD03BxxAJGvDOSuX5A6oNGoKvoKuT003N3Y8c-KL66zCjfrGyyy2K