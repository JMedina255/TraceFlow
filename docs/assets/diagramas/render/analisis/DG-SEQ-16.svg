<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="450px" preserveAspectRatio="none" style="width:1063px;height:450px;background:#FFFFFF;" version="1.1" viewBox="0 0 1063 450" width="1063px" zoomAndPan="magnify"><title>&lt;b&gt;DG-SEQ-16: Ejecutar pruebas de integraci&#195;&#179;n (CU-16)&lt;/b&gt;</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="357.0752" x="352.7485" y="28.1318">DG-SEQ-16: Ejecutar pruebas de integraci&#195;&#179;n (CU-16)</text><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="65" x2="65" y1="134.2959" y2="353.9883"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="579.7114" x2="579.7114" y1="134.2959" y2="353.9883"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="114.4199" x="5" y="115.2305">Equipo de Calidad</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="53.6895" x="35.3652" y="131.3291">/ Testing</text><ellipse cx="65.21" cy="50.5986" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M65.21,58.5986 L65.21,85.5986 M52.21,66.5986 L78.21,66.5986 M65.21,85.5986 L52.21,100.5986 M65.21,85.5986 L78.21,100.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="114.4199" x="5" y="366.1201">Equipo de Calidad</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="53.6895" x="35.3652" y="382.2188">/ Testing</text><ellipse cx="65.21" cy="393.6855" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M65.21,401.6855 L65.21,428.6855 M52.21,409.6855 L78.21,409.6855 M65.21,428.6855 L52.21,443.6855 M65.21,428.6855 L78.21,443.6855 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="522.7114" y="103.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="529.7114" y="123.3291">TraceFlow SCM</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="522.7114" y="352.9883"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="529.7114" y="373.1201">TraceFlow SCM</text><polygon fill="#181818" points="567.8838,161.2446,577.8838,165.2446,567.8838,169.2446,571.8838,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="65.21" x2="573.8838" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.0869" x="130.0034" y="160.4897">1. Seleccionar RFC en estado 'En Pruebas' desde panel de control</text><polygon fill="#181818" points="76.21,190.1934,66.21,194.1934,76.21,198.1934,72.21,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="70.21" x2="578.8838" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="490.6738" x="77.21" y="189.4385">2. Presentar expediente, ECN/ECO, ECS en Biblioteca de Soporte y plan de pruebas</text><polygon fill="#181818" points="567.8838,219.1421,577.8838,223.1421,567.8838,227.1421,571.8838,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="65.21" x2="573.8838" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="466.8257" x="89.134" y="218.3872">3. Ejecutar casos de prueba funcionales, de integraci&#195;&#179;n y regresi&#195;&#179;n en Soporte</text><line style="stroke:#181818;stroke-width:1.0;" x1="579.8838" x2="621.8838" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="621.8838" x2="621.8838" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="580.8838" x2="621.8838" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="590.8838,261.0908,580.8838,265.0908,590.8838,269.0908,586.8838,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="453.8257" x="586.8838" y="247.3359">4. Registrar resultados de cada caso de prueba (aprobado/fallido) y evidencias</text><line style="stroke:#181818;stroke-width:1.0;" x1="579.8838" x2="621.8838" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="621.8838" x2="621.8838" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="580.8838" x2="621.8838" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="590.8838,303.0396,580.8838,307.0396,590.8838,311.0396,586.8838,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="469.6885" x="586.8838" y="289.2847">5. Consolidar informe de ejecuci&#195;&#179;n determinando cobertura y criterios de calidad</text><polygon fill="#181818" points="76.21,331.9883,66.21,335.9883,76.21,339.9883,72.21,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="70.21" x2="578.8838" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="471.8086" x="86.6426" y="331.2334">6. Confirmar cierre de bater&#195;&#173;a y presentar resumen para certificar o reportar fallo</text><!--SRC=[RLBBSXCn4BplLqpbagGgjYiyKfGhvIgph3abu3ZSkCngnsP0AsqaBI5dleSJVm0_HcknOnVa9cb6tJqz7R-ewpXmI_4JD_vUtORMRACKyR4IVEyQuuEJGAyEtXjPSs_JmhjqpQtGF2ZRWtgKkrwSaIk9aJSojxfnPCGb2KMHD5cXothsvkr