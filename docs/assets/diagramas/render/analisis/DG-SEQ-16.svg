<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="450px" preserveAspectRatio="none" style="width:1060px;height:450px;background:#FFFFFF;" version="1.1" viewBox="0 0 1060 450" width="1060px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="365" x="347" y="28.1318">DG-SEQ-16: Ejecutar pruebas de integraci&#243;n (CU-16)</text><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="66" x2="66" y1="134.2959" y2="353.9883"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="583" x2="583" y1="134.2959" y2="353.9883"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="116" x="5" y="115.2305">Equipo de Calidad</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="55" x="35.5" y="131.3291">/ Testing</text><ellipse cx="66" cy="50.5986" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M66,58.5986 L66,85.5986 M53,66.5986 L79,66.5986 M66,85.5986 L53,100.5986 M66,85.5986 L79,100.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="116" x="5" y="366.1201">Equipo de Calidad</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="55" x="35.5" y="382.2188">/ Testing</text><ellipse cx="66" cy="393.6855" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M66,401.6855 L66,428.6855 M53,409.6855 L79,409.6855 M66,428.6855 L53,443.6855 M66,428.6855 L79,443.6855 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114" x="526" y="103.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100" x="533" y="123.3291">TraceFlow SCM</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114" x="526" y="352.9883"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100" x="533" y="373.1201">TraceFlow SCM</text><polygon fill="#181818" points="571,161.2446,581,165.2446,571,169.2446,575,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="66" x2="577" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385" x="132" y="160.4897">1. Seleccionar RFC en estado 'En Pruebas' desde panel de control</text><polygon fill="#181818" points="77,190.1934,67,194.1934,77,198.1934,73,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="71" x2="582" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="493" x="78" y="189.4385">2. Presentar expediente, ECN/ECO, ECS en Biblioteca de Soporte y plan de pruebas</text><polygon fill="#181818" points="571,219.1421,581,223.1421,571,227.1421,575,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="66" x2="577" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="456" x="96.5" y="218.3872">3. Ejecutar casos de prueba funcionales, de integraci&#243;n y regresi&#243;n en Soporte</text><line style="stroke:#181818;stroke-width:1.0;" x1="583" x2="625" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="625" x2="625" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="584" x2="625" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="594,261.0908,584,265.0908,594,269.0908,590,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="451" x="590" y="247.3359">4. Registrar resultados de cada caso de prueba (aprobado/fallido) y evidencias</text><line style="stroke:#181818;stroke-width:1.0;" x1="583" x2="625" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="625" x2="625" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="584" x2="625" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="594,303.0396,584,307.0396,594,311.0396,590,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="463" x="590" y="289.2847">5. Consolidar informe de ejecuci&#243;n determinando cobertura y criterios de calidad</text><polygon fill="#181818" points="77,331.9883,67,335.9883,77,339.9883,73,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="71" x2="582" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="458" x="95.5" y="331.2334">6. Confirmar cierre de bater&#237;a y presentar resumen para certificar o reportar fallo</text><!--SRC=[RLBBRjim4BphAnQ-905Y6UaZA8p0WAhAFIMje_JMoufQkTjIfBAackQZUkedvCUwL9pOQ7eZkSkPsTa9FzWDADX3-8QjlsEtXGvje2myLyIFhZLU70cyEtXlgSFHnhLtyGfxWa8OxK4zqEr8pj0bXO1RAYnl7HXoaIJB8aTBSD6iFdoSrzLcVdQ-XEexcJ6Ym20ZDHYK0LZRjuA67_uuE2w_QEF9nQ9PPHcQw0LcrUt8Wq-j9LfkiVtg5d138UeeCr2GJP6fdiY61tGHPZUAHclhxw0kBwUEcaEa7hDiKy1yzNHTmbaEDLaoXhrJLTVh4iY1GgjJS5Gv-FoeyqZPWmfGVB99YL5BnDjiXmHpHTqKItYLwnSAQe72qQ-1Mavsd49LNYsgybCwr8dZFJUMVII32QxsWvT8S0-3HPTUTWRzA_XrllVGOF1XtmlTwAOvB8NJ5yRUW-Y5mdHH_XtZVe03aZSvNDDMRw8i-aSZe7vCL0PRd8WFU8zn4Dzenq9pfGlo9yf6FxdLQB2Ey3-AjpcKtWMVzYcgjFEY-L9CIjCzIcv9SzIpGwVBCBuXYQEWOXjXhV2JeYaJBpPnFZ5qB7soYabamczGlpxyJZ33ywBIZBsQabAj-TKeTMpq