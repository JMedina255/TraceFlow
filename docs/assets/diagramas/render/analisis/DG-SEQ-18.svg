rtar no conformidad sobre RFC en 'En Pruebas'</text><polygon fill="#181818" points="77,190.1934,67,194.1934,77,198.1934,73,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="71" x2="545" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="436" x="88" y="189.4385">2. Presentar formulario de registro de defectos precargando pruebas fallidas</text><polygon fill="#181818" points="534,219.1421,544,223.1421,534,227.1421,538,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="66" x2="540" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="456" x="78" y="218.3872">3. Detallar descripci&#243;n del error, severidad, pasos de reproducci&#243;n y evidencias</text><line style="stroke:#181818;stroke-width:1.0;" x1="546" x2="588" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="588" x2="588" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="547" x2="588" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="557,261.0908,547,265.0908,557,269.0908,553,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="437" x="553" y="247.3359">4. Validar reporte, asentar defecto e incrementar contador de ciclos (RN-08)</text><line style="stroke:#181818;stroke-width:1.0;" x1="546" x2="588" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="588" x2="588" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="547" x2="588" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="557,303.0396,547,307.0396,557,311.0396,553,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" l