.6855 M65.21,428.6855 L78.21,443.6855 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="501.707" y="103.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="508.707" y="123.3291">TraceFlow SCM</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="501.707" y="352.9883"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="508.707" y="373.1201">TraceFlow SCM</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="136.9785" x="952.2388" y="115.2305">Ingeniero de Software</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="91.8135" x="974.8213" y="131.3291">/ Desarrollador</text><ellipse cx="1023.728" cy="50.5986" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1023.728,58.5986 L1023.728,85.5986 M1010.728,66.5986 L1036.728,66.5986 M1023.728,85.5986 L1010.728,100.5986 M1023.728,85.5986 L1036.728,100.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="136.9785" x="952.2388" y="366.1201">Ingeniero de Software</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="91.8135" x="974.8213" y="382.2188">/ Desarrollador</text><ellipse cx="1023.728" cy="393.6855" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1023.728,401.6855 L1023.728,428.6855 M1010.728,409.6855 L1036.728,409.6855 M1023.728,428.6855 L1010.728,443.6855 M1023.728,428.6855 L1036.728,443.6855 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="546.8794,161.2446,556.8794,165.2446,546.8794,169.2446,550.8794,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="65.21" x2="552.8794" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="451.5342" x="86.2776" y="160.4897">1. Seleccionar opci&#195;&#179;n de reportar no conformidad sobre RFC en 'En Pruebas'</text><polygon fill="#181818" points="76.21,190.1934,66.21,194.1934,76.21,198.1934,72.21,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="70.21" x2="557.8794" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="439.3594" x="92.365" y="189.4385">2. Presentar formulario de registro de defectos precargando pruebas fallidas</text><polygon fill="#181818" points="546.8794,219.1421,556.8794,223.1421,546.8794,227.1421,550.8794,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="65.21" x2="552.8794" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="469.6694" x="77.21" y="218.3872">3. Detallar descripci&#195;&#179;n del error, severidad, pasos de reproducci&#195;&#179;n y evidencias</text><line style="stroke:#181818;stroke-width:1.0;" x1="558.8794" x2="600.8794" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="600.8794" x2="600.8794" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="559.8794" x2="600.8794" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="569.8794,261.0908,559.8794,265.0908,569.8794,269.0908,565.8794,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="437.8804" x="565.8794" y="247.3359">4. Validar reporte, asentar defecto e incrementar contador de ciclos (RN-08)</text><line style="stroke:#181818;stroke-width:1.0;" x1="558.8794" x2="600.8794" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="600.8794" x2="600.8794" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="559.8794" x2="600.8794" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="569.8794,303.0396,559.8794,307.0396,569.8794,311.0396,565.8794,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="450.8486" x="565.8794" y="289.2847">5. Registrar Informe de No Conformidad y suspender tr&#195;&#161;mite de certificaci&#195;&#179;n</text><polygon fill="#181818" points="1011.728,331.9883,1021.728,335.9883,1011.728,339.9883,1015.728,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="558.8794" x2="1017.728" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="438.604" x="572.0017" y="331.2334">6. Notificar formalmente para ejecutar correcciones en Biblioteca de Trabajo</text><!--SRC=[TLBDRjD04BxxAKQvj9KQb_AdAAeYXVoW7XgHf73YCbvFp9JDhZkxJjGpJy8py0RmOipQIHKGt2pFxFSxuIkx6WMt4BvWwVViAjYW3PI5vudunfN6YoE1mSd_aZROs3ZtBYvmIp0MHdio3_JOa3DqHo5WHMFBbGD3Bf9aMUHe2MwAqVHzVprRzgy7GrXHxIMYWFDWlDjusNA99PnFFkhyukQg66KPckW5UhF7Xckl6c22DcrzTbTmJo6gWnvWWEKuKncH3TVe8lJk1GtDhT_3UdBNRgmvHDhY4V7MLUIOf0LT-qtSer12dL904M-j1YJjoodjicmvXlxe23A4wnpMPCaOzauj-Dhmhsy_VxY49lyn5dmX1Alv1CZ1sSp11scem72M7M2XhnJByH1UvZgZeE4fIdhVM1Js7NYbovrihOJKJO1QoA1Kw4gltorewZKb5VvM_YfNGr672brICC8dsYsGUfTBRND7abHVGer1AJfVuil67DUVW7PSQkUiBCyMJgXUv_2fhKiEcT2bvjcvEcW70dP6QDlzrRXYoZtH6JPMYSzNY_wBmSK_2TxaUaLj7lhsjaqwfG8B3vEJu9yWDA4cL-f9Hr7ntxSSsqL3UZCRDdZmz4SJsliGtkQArkrqLQ1DMWdIrGCza6awuIBTDL18zRxZmhAFMakYqMiiyC5dlm40]--></g></svg>