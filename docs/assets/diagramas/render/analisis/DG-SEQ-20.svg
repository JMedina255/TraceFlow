 style="stroke:#181818;stroke-width:1.0;" x1="109.1582" x2="549.1313" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="403.9331" x="130.1782" y="218.3872">3. Asignar etiqueta formal de versionamiento y solicitar congelamiento</text><line style="stroke:#181818;stroke-width:1.0;" x1="555.1313" x2="597.1313" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="597.1313" x2="597.1313" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="556.1313" x2="597.1313" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="566.1313,261.0908,556.1313,265.0908,566.1313,269.0908,562.1313,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="489.8931" x="562.1313" y="247.3359">4. Validar est&#195;&#161;ndar de versiones y pertenencia a Biblioteca Maestra (RN-02, RN-04)</text><line style="stroke:#181818;stroke-width:1.0;" x1="555.1313" x2="597.1313" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="597.1313" x2="597.1313" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="556.1313" x2="597.1313" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="566.1313,303.0396,556.1313,307.0396,566.1313,311.0396,562.1313,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="494.8633" x="562.1313" y="289.2847">5. Congelar L&#195;&#173;nea Base contra edici&#195;&#179;n, registrar firma y actualizar a 'Implementada'</text><polygon fill="#181818" points="120.1582,331.9883,110.1582,335.9883,120.1582,339.9883,116.1582,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="114.1582" x2="554.1313" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4985" x="150.3955" y="331.2334">6. Expedir Certificado formal de nueva L&#195;&#173;nea Base congelada</text><polygon fill="#181818" points="1051.9946,360.937,1061.9946,364.937,1051.9946,368.937,1055.9946,364.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="555.1313" x2="1057.9946" y1="364.937" y2="364.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="449.4141" x="584.856" y="360.1821">6. Notificar cierre exitoso del cambio en estado Implementada (RF-14, RN-07)</text><polygon fill="#181818" points="1223.3208,389.8857,1233.3208,393.8857,1223.3208,397.8857,1227.3208,393.8857" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="555.1313" x2="1229.3208" y1="393.8857" y2="393.8857"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.7261" x="750.363" y="389.1309">6. Notificar cierre formal del cambio implementado</text><!--SRC=[RL9DRzD04BtxLunoQIFLQHl2Xw8gKc8IL8b4G80JbybwuewwtWsxwxJXoY_Xo84J_m3-6BFEbojoyjYxyzxpUy_VircXmnBy7URsWKq1IzIU4dyuSROokRBEa8DNZUyvBR7IOM9Dc659C7ICkd7kwMj5Hj6KlCU2XfeB0ufC89SaWOCck5aCNhz9v-FtQVUg3vaZTB01PKr1MaRzz_kVNuOG5kW9phDFSgrzSxaO90cgO1sqXdd9Xdrm8jw98iYiMN9HELGiox_D5tC98rveje4KEhOjG0_rMY8o0ojUeGdG-YWhDD7s0URPjBuq5rmgSK-LsPA3OFxSqGHdTJrYkM3hHLusQjUBCkoNvbOBGn06sc8UtvEaLW7fOC_KX-iE39MYN9n63MNyWxpIDjAytNdXOHJDs8YzcfHYQyIeSJO7yK2exqZTfxScsK52Al0rJn-w7NZdo4i0ii5cNGziezsm9kS5YhmS12h4JW7RG6uNaf9SM5fNSexv2StFHBENQ0MK0ala0I5UnzgT7J2MB7GsojuvuFOnRq-EWXlGlGvyHYsy0ksZzpzCd8-m54Mko0KoqZH6m4ROC4MApO3p3xFqgdi1yT5hdsHwtecHRbktTtfhj8f98r3EkqPTWAEYhfo39Sj_YWH9knAXt-GJmjbjkT9KHdjpF3kLn8iEZ1zN0kaW4_6yP2NzRRXcAbhZ_qAYlXoV84hNQhoPtSA8hKpE4T0Z1-jZTJIekg909jeOcPeAnPv9UjtRslEo_GIzKTVJB0V91n8-Gjla7m00]--></g></svg>