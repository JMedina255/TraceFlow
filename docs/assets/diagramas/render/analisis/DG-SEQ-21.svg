5" y="131.3291">Comit&#233; de Control de Cambios (CCB)</text><ellipse cx="1297.5" cy="66.6973" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1297.5,74.6973 L1297.5,101.6973 M1284.5,82.6973 L1310.5,82.6973 M1297.5,101.6973 L1284.5,116.6973 M1297.5,101.6973 L1310.5,116.6973 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="236" x="1176.5" y="424.0176">Comit&#233; de Control de Cambios (CCB)</text><ellipse cx="1297.5" cy="435.4844" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1297.5,443.4844 L1297.5,470.4844 M1284.5,451.4844 L1310.5,451.4844 M1297.5,470.4844 L1284.5,485.4844 M1297.5,470.4844 L1310.5,485.4844 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="592.5,161.2446,602.5,165.2446,592.5,169.2446,596.5,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="107.5" x2="598.5" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="442" x="135" y="160.4897">1. Seleccionar orden no conforme sujeta a reversi&#243;n en Biblioteca de Trabajo</text><polygon fill="#181818" points="118.5,190.1934,108.5,194.1934,118.5,198.1934,114.5,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="112.5" x2="603.5" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="473" x="119.5" y="189.4385">2. Presentar historial de versiones del ECS y versi&#243;n de origen estable en Soporte</text><polygon fill="#181818" points="592.5,219.1421,602.5,223.1421,592.5,227.1421,596.5,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="107.5" x2="598.5" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405" x="153.5" y="218.3872">3. Confirmar ejecuci&#243;n de reversi&#243;n (rollback) sobre la copia de trabajo</text><line style="stroke:#181818;stroke-width:1.0;" x1="604.5" x2="646.5" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="646.5" x2="646.5" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="605.5" x2="646.5" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="615.5,261.0908,605.5,265.0908,615.5,269.0908,611.5,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="462" x="611.5" y="247.3359">4. Validar que ECS no ingres&#243; a Maestra y restringir reversi&#243;n a Trabajo (RN-08)</text><line style="stroke:#181818;stroke-width:1.0;" x1="604.5" x2="646.5" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="646.5" x2="646.5" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="605.5" x2="646.5" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="615.5,303.0396,605.5,307.0396,615.5,311.0396,611.5,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="476" x="611.5" y="289.2847">5. Descartar cambios no conformes, restituir copia previa y liberar bloqueo (RN-06)</text><polygon fill="#181818" points="118.5,331.9883,108.5,335.9883,118.5,339.9883,114.5,335.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="112.5" x2="603.5" y1="335.9883" y2="335.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="420" x="146" y="331.2334">6. Asentar acta de reversi&#243;n en auditor&#237;a habilitando cancelaci&#243;n (CU-22)</text><polygon fill="#181818" points="1082.5,360.937,1092.5,364.9