><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="99.5" x2="562.5" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="445" x="106.5" y="189.4385">2. Presentar opci&#243;n de derivaci&#243;n formal hacia flujo de Solicitudes de Cambio</text><polygon fill="#181818" points="551.5,219.1421,561.5,223.1421,551.5,227.1421,555.5,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="94.5" x2="557.5" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="443" x="107.5" y="218.3872">3. Confirmar derivaci&#243;n identificando ECS preliminar y fundamentando causal</text><line style="stroke:#181818;stroke-width:1.0;" x1="563.5" x2="605.5" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="605.5" x2="605.5" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="564.5" x2="605.5" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="574.5,261.0908,564.5,265.0908,574.5,269.0908,570.5,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393" x="570.5" y="247.3359">4. Validar no derivaci&#243;n previa y pre-poblar datos enlazando a CU-04</text><line style="stroke:#181818;stroke-width:1.0;" x1="563.5" x2="605.5" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="605.5" x2="605.5" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="564.5" x2="605.5" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="574.5,303.0396,564.5,307.0396,574.5,311.0396,570.5,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="457" x="570.5" y="289.2847">5. Registrar formalmente RFC seg&#250;n flujo CU-04 en estado 'Registrada' (RN-01)</text><line style="stroke:#181818;stroke-width:1.0;" x1="563.5" x2="605.5" y1="335.9883" y2="335.9883"/><line style="stroke:#181818;stroke-width:1.0;" x1="605.5" x2="605.5" y1="335.9883" y2="348.9883"/><line style="stroke:#181818;stroke-width:1.0;" x1="564.5" x2="605.5" y1="348.9883" y2="348.9883"/><polygon fill="#181818" points="574.5,344.9883,564.5,348.9883,574.5,352.9883,570.5,348.9883" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354" x="570.5" y="331.2334">6. Actualizar ticket a 'Derivada' y asentar v&#237;nculo bidireccional</text><polygon fill="#181818" points="1022.5,373.937,1032.5,377.937,1022.5,381.937,1026.5,377.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="563.5" x2="1028.5" y1="377.937" y2="377.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="348" x="625" y="373.1821">6. Notificar c&#243;digo de nueva RFC asignada para seguimiento</text><!--SRC=[RLCzRzim4DtrAmvUd0nMFfeKXH4OC9GuKupMRZjrEP4dvngAT4dAWVEVEcNhwZ_MesIxTk5DrBrxxztnCRomNQB76i8pQlVATW4Lca1Ps5UyQwnMpbloyEdWlwOA6nCdpiOfrWHZpsWEwe5-DMGLFL48kA2nuOK5HJQIpxB8qH3SbQFxny7yuSlW-dO8z-HvXHxOAjRIoGW8iqa1PyKt0PpVNPIZB4CLdOVUsABX455im2mfUQvPo5tuOI_WaOAWUe01Ti1CN4LMl4GReVVLewA9SQymBvvQt5n0LEEEV-wCWAE0gIl_EsVPNdmmslKDuIg7EHbIYftzRugIoGjw3PfLn9fJNIo35-DI8gYTveeLAjwyssnB2GEXtqaDuJg7pvw2p2ZTRjb2q_IwNLjth9olqS0p9jdAD3zTGcozDvf2EXPOb-nE3_4XXyBPYeN67p6dMMBhqMe73yKSbfuCTxEiePACI0Z4MoehR89aOJ_7WS1D3jz5LqkNTKSAmhVYj2Jv62nTQP83b0i5iWRVMc84YSBbpKdcsro2i92JbyPk4SaGjH4AjDZyiTkLj1p22f8IIJtqTtqQ-t0scmukhyvFIdpCOQnY8_xVH4FIz49HFFMxvARkjMIbkw7LvhTLZN5GicQ_ZOKvkjk3JBNSKzTjs8FQl6jUj9Td6rfrpm23l21HWVI-qaJDDlBPNm00]--></g></svg>