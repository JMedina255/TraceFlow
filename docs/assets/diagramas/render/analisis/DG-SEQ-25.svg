 x="125.1125" y="160.4897">1. Seleccionar incidencia abierta y dictaminar que requiere modificaci&#195;&#179;n</text><polygon fill="#181818" points="104.603,190.1934,94.603,194.1934,104.603,198.1934,100.603,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="98.603" x2="574.7261" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="458.123" x="105.603" y="189.4385">2. Presentar opci&#195;&#179;n de derivaci&#195;&#179;n formal hacia flujo de Solicitudes de Cambio</text><polygon fill="#181818" points="563.7261,219.1421,573.7261,223.1421,563.7261,227.1421,567.7261,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="93.603" x2="569.7261" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="453.0576" x="108.1357" y="218.3872">3. Confirmar derivaci&#195;&#179;n identificando ECS preliminar y fundamentando causal</text><line style="stroke:#181818;stroke-width:1.0;" x1="575.7261" x2="617.7261" y1="252.0908" y2="252.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="617.7261" x2="617.7261" y1="252.0908" y2="265.0908"/><line style="stroke:#181818;stroke-width:1.0;" x1="576.7261" x2="617.7261" y1="265.0908" y2="265.0908"/><polygon fill="#181818" points="586.7261,261.0908,576.7261,265.0908,586.7261,269.0908,582.7261,265.0908" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="404.6694" x="582.7261" y="247.3359">4. Validar no derivaci&#195;&#179;n previa y pre-poblar datos enlazando a CU-04</text><line style="stroke:#181818;stroke-width:1.0;" x1="575.7261" x2="617.7261" y1="294.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="617.7261" x2="617.7261" y1="294.0396" y2="307.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="576.7261" x2="617.7261" y1="307.0396" y2="307.0396"/><polygon fill="#181818" points="586.7261,303.0396,576.7261,307.0396,586.7261,311.0396,582.7261,307.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="469.2314" x="582.7261" y="289.2847">5. Registrar formalmente RFC seg&#195;&#186;n flujo CU-04 en estado 'Registrada' (RN-01)</text><line style="stroke:#181818;stroke-width:1.0;" x1="575.7261" x2="617.7261" y1="335.9883" y2="335.9883"/><line style="stroke:#181818;stroke-width:1.0;" x1="617.7261" x2="617.7261" y1="335.9883" y2="348.9883"/><line style="stroke:#181818;stroke-width:1.0;" x1="576.7261" x2="617.7261" y1="348.9883" y2="348.9883"/><polygon fill="#181818" points="586.7261,344.9883,576.7261,348.9883,586.7261,352.9883,582.7261,348.9883" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="364.0762" x="582.7261" y="331.2334">6. Actualizar ticket a 'Derivada' y asentar v&#195;&#173;nculo bidireccional</text><polygon fill="#181818" points="1046.9575,373.937,1056.9575,377.937,1046.9575,381.937,1050.9575,377.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="575.7261" x2="1052.9575" y1="377.937" y2="377.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.9731" x="638.8552" y="373.1821">6. Notificar c&#195;&#179;digo de nueva RFC asignada para seguimiento</text><!--SRC=[RLCzRzim4DtrAmvUd0nMFfeKXH4OC9GuKumsQZjrEP4dvngAT4dAWRFsztJgrh7zOprAjkiQtaJTk_VkurruPhj4Zms49zJkXUq2QZI1ih2BUDTQhPotvE7TtdzDDROcpfoDSsm8ffxHxCK3VMl9AdgW4711KyCB2ufi99zbaQCXkAacj_UZykx3wF9w3BVaUOKUs2hMaia828-p0awAJm8ulJch9bc6AZeFWwb5mo6Yb06FISbpmqBkmXTx1lSK13K03B05Pb9LPCLBj1467pqgcXdt0cNnqE5A0L63M_xI6G570LCV_lVEiftuQBBD6yD53YKPKegTFUYYOlA2NeDc5R7X59UImKlX4Y9edEQQ5Ih-y_ttJvjjI64a0bknCLpcyDvJa2ubtoqtu3G1t