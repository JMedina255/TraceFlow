suario Final)</text><ellipse cx="68.8999" cy="540.4292" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M68.8999,548.4292 L68.8999,575.4292 M55.8999,556.4292 L81.8999,556.4292 M68.8999,575.4292 L55.8999,590.4292 M68.8999,575.4292 L81.8999,590.4292 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="540.8486" y="103.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="547.8486" y="123.3291">TraceFlow SCM</text><rect fill="#E2E2F0" height="30.0986" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="114.3447" x="540.8486" y="499.7319"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3447" x="547.8486" y="519.8638">TraceFlow SCM</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="202.3164" x="1038.9204" y="115.2305">Administrador de Configuraci&#195;&#179;n</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="84.041" x="1098.0581" y="131.3291">/ Bibliotecario</text><ellipse cx="1143.0786" cy="50.5986" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1143.0786,58.5986 L1143.0786,85.5986 M1130.0786,66.5986 L1156.0786,66.5986 M1143.0786,85.5986 L1130.0786,100.5986 M1143.0786,85.5986 L1156.0786,100.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="202.3164" x="1038.9204" y="512.8638">Administrador de Configuraci&#195;&#179;n</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="84.041" x="1098.0581" y="528.9624">/ Bibliotecario</text><ellipse cx="1143.0786" cy="540.4292" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1143.0786,548.4292 L1143.0786,575.4292 M1130.0786,556.4292 L1156.0786,556.4292 M1143.0786,575.4292 L1130.0786,590.4292 M1143.0786,575.4292 L1156.0786,590.4292 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="586.021,161.2446,596.021,165.2446,586.021,169.2446,590.021,165.2446" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="68.8999" x2="592.021" y1="165.2446" y2="165.2446"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="456.5806" x="105.1702" y="160.4897">1. Acceder a bandeja y seleccionar RFC en 'En Aceptaci&#195;&#179;n' certificada por QA</text><polygon fill="#181818" points="79.8999,190.1934,69.8999,194.1934,79.8999,198.1934,75.8999,194.1934" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="73.8999" x2="597.021" y1="194.1934" y2="194.1934"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="468.292" x="99.3145" y="189.4385">2. Presentar entorno de pruebas de aceptaci&#195;&#179;n y resumen de necesidad original</text><polygon fill="#181818" points="586.021,219.1421,596.021,223.1421,586.021,227.1421,590.021,223.1421" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="68.8999" x2="592.021" y1="223.1421" y2="223.1421"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="505.1211" x="80.8999" y="218.3872">3. Ejecutar pruebas de aceptaci&#195;&#179;n verificando satisfacci&#195;&#179;n de necesidades operativas</text><polygon fill="#181818" points="586.021,248.0908,596.021,252.0908,586.021,256.0908,590.021,252.0908" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="68.8999" x2="592.021" y1="252.0908" y2="252.0908"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="419.7642" x="123.5784" y="247.3359">4. Confirmar que soluci&#195;&#179;n satisface requerimientos y suscribir Acta UAT</text><line style="stroke:#181818;stroke-width:1.0;" x1="598.021" x2="640.021" y1="281.0396" y2="281.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="640.021" x2="640.021" y1="281.0396" y2="294.0396"/><line style="stroke:#181818;stroke-width:1.0;" x1="599.021" x2="640.021" y1="294.0396" y2="294.0396"/><polygon fill="#181818" points="609.021,290.0396,599.021,294.0396,609.021,298.0396,605.021,294.0396" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="531.0576" x="605.021" y="276.2847">5. Validar suscripci&#195;&#179;n de acta, verificar certificaci&#195;&#179;n de QA y anexar al expediente (RN-09)</text><polygon fill="#181818" points="79.8999,318.9883,69.8999,322.9883,79.8999,326.9883,75.8999,322.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="73.8999" x2="597.021" y1="322.9883" y2="322.9883"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="310.7051" x="178.1079" y="318.2334">6. Emitir constancia formal de conformidad de usuario</text><polygon fill="#181818" points="1131.0786,347.937,1141.0786,351.937,1131.0786,355.937,1135.0786,351.937" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="598.021" x2="1137.0786" y1="351.937" y2="351.937"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6904" x="665.7046" y="347.1821">6. Notificar cumplimiento de doble validaci&#195;&#179;n para Check-In a Maestra</text><path d="M14,366.937 L70.1709,366.937 L70.1709,373.8857 L60.1709,383.8857 L10,383.8857 L10,370.937 A4,4 0 0 1 14,366.937 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="116.7949" rx="4" ry="4" style="stroke:#