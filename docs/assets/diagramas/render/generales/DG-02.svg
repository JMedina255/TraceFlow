<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="965px" preserveAspectRatio="none" style="width:1621px;height:965px;background:#FFFFFF;" version="1.1" viewBox="0 0 1621 965" width="1621px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="443" x="587.5" y="33.1318">&#201;XODO S.A.C. - Proceso Actual Emp&#237;rico de Modificaci&#243;n (AS-IS)</text><rect fill="none" height="20.6982" style="stroke:none;stroke-width:1.0;" width="1588" x="15" y="49.4131"/><ellipse cx="133" cy="85.1113" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="47.5977" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="224" x="21" y="115.1113"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="204" x="31" y="136.3672">Identificar necesidad o requerimiento</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="110" x="31" y="150.166">arbitrario de cambio</text><rect fill="#F1F1F1" height="47.5977" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="184" x="41" y="182.709"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="164" x="51" y="203.9648">Modificar c&#243;digo directamente</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="136" x="51" y="217.7637">en equipo personal local</text><rect fill="#F1F1F1" height="61.3965" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="179" x="43.5" y="250.3066"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="159" x="53.5" y="271.5625">Nombrar archivos o carpetas</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="101" x="53.5" y="285.3613">de forma arbitraria</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="132" x="53.5" y="299.1602">(ej. "Proyecto_Final_v2")</text><rect fill="#F1F1F1" height="61.3965" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="186" x="40" y="331.7031"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="138" x="50" y="352.959">Enviar archivos alterados</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="125" x="50" y="366.7578">por medios informales</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="166" x="50" y="380.5566">(correo electr&#243;nico, chat, USB)</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="49.4131" y2="953.084"/><rect fill="#F1F1F1" height="47.5977" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="220" x="467" y="413.0996"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="155" x="477" y="434.3555">Recibir archivos divergentes</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="200" x="477" y="448.1543">sin control de versiones centralizado</text><polygon fill="#F1F1F1" points="468,480.6973,686,480.6973,698,492.6973,686,504.6973,468,504.6973,456,492.6973,468,480.6973" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="218" x="468" y="496.6907">&#191;Trabajo concurrente de varios consultores?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="9" x="447" y="490.3662">S&#237;</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="13" x="698" y="490.3662">No</text><path d="M457,518.5474 L457,534.4961 L437,538.4961 L457,542.4961 L457,558.4448 A0,0 0 0 0 457