="spacing" textLength="154.0605" x="52.3604" y="271.5625">Nombrar archivos o carpetas</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="98.0391" x="52.3604" y="285.3613">de forma arbitraria</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="131.9063" x="52.3604" y="299.1602">(ej. "Proyecto_Final_v2")</text><rect fill="#F1F1F1" height="61.3965" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="189.3887" x="34.6963" y="331.7031"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="134.7305" x="44.6963" y="352.959">Enviar archivos alterados</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="118.0488" x="44.6963" y="366.7578">por medios informales</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="169.3887" x="44.6963" y="380.5566">(correo electr&#195;&#179;nico, chat, USB)</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="49.4131" y2="953.084"/><rect fill="#F1F1F1" height="47.5977" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="214.1035" x="468.9973" y="413.0996"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="150.7324" x="478.9973" y="434.3555">Recibir archivos divergentes</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="194.1035" x="478.9973" y="448.1543">sin control de versiones centralizado</text><polygon fill="#F1F1F1" points="463.2427,480.6973,688.8555,480.6973,700.8555,492.6973,688.8555,504.6973,463.2427,504.6973,451.2427,492.6973,463.2427,480.6973" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="225.6128" x="463.2427" y="496.6907">&#194;&#191;Trabajo concurrente de varios consultores?</text><text fill="#000000" font-fa